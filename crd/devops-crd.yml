kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: devopsbatches.trainwithhussnain.com
spec: 
 group: trainwithhussnain.com
 names:
   plural: devopsbatches
   singular: devopsbatch
   kind: DevopsBatch
   shortNames:
     - junoon
     - batches
     - tws
 scope: Namespaced 
 versions:
   - name: v1
     served: true
     storage: true
     schema:
       openAPIV3Schema:
         type: object
         properties:
          spec: 
            type: object
            properties:
              name:
                type: string
                description: "This is the name of the DevOps Batch"
              duration:
                type: string
                description: "This is the duration of the DevOps Batch"
              mode:
                type: string
                description: "This is the mode of the batch eg. Live/Recorded"
              platform:
                type: string
                description: "This is the platform of the batch"
