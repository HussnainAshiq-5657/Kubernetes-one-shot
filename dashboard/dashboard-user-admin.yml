kind: ServiceAccount
apiVersion: v1
metadata:
  name: cluster-user
  namespace: kubernetes-dashboard

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-role-binding
subjects:
- kind: ServiceAccount
  name: cluster-user
  namespace: kubernetes-dashbaord
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
