kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: notes-app-hpa
  namespace: nginx
spec: 
 scaleTargetRef:
   name: notes-app-deployment
   kind: Deployment
   apiVersion: apps/v1

 minReplicas: 1
 maxReplicas: 5

 metrics:
   - type: Resource
     resource:
       name: cpu
       target:
         type: Utilization
         averageUtilization: 8
